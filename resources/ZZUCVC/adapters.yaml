    maintainer: "Mutx163"
    description: "从智慧校园统一身份认证入口登录（portal.zzucvc.edu.cn），使用门户账号，适用于教务系统未单独开通密码的学生。登录门户后，请在「应用中心」或首页应用列表打开「教务管理系统」进入教务系统，再在教务系统页面执行本导入。导入过程与教务系统直连入口一致。"
