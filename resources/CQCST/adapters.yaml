# resources/CQCST/adapters.yaml
#
# 本文件里的脚本必须只用上游标准接口，以便原样提交给上游
# XingHeYuZhuan/shiguang_warehouse。
#
# 强智登录后固定落在「学生个人中心」，登录表单也不支持跳转参数，所以 import_url
# 只能指向系统根目录（那是登录入口，不是最终目标页）。课表数据由脚本直接请求
# 课表页取得，登录后在任意页面点运行即可，不需要手动走到课表页。
#
# 学校按「校区 + 教学楼类型」公布 4 套作息（第 3、4 节相差 5~15 分钟），但一次导入
# 只能保存一套全局作息，无法按教室分流。本脚本只问校区、下发该校区的兜底作息；
# 需要按教学楼自动分流的宿主可在数据侧扩展（本校的分流数据见仓库 qingyu_only/
# 目录，由宿主 App 读取应用）。
adapters:
  - adapter_id: "CQCST_01"
    adapter_name: "重庆城市科技学院强智适配"
    category: "BACHELOR_AND_ASSOCIATE"
    asset_js_path: "cqcst_01.js"
    import_url: "http://jw.cqcst.edu.cn/cqdxcskjxy_jsxsd/"
    maintainer: "Mutx163"
    description: "登录后在任意页面点运行即可，脚本自动获取本学期课表。自动附带学校公布的作息时间表（两校区作息略有差异，导入时选所在校区）。"
