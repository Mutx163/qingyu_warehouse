# resources/CQCST/adapters.yaml
# 两个版本并存（同 CUIT / GZTRC 的做法）：
#   CQCST_01 标准版    —— 只用上游标准接口，任何 App 都能用，可直接回流上游
#   CQCST_02 分楼栋版  —— 额外用扩展接口按教学楼分流作息，需宿主支持；不支持时自动退回标准版走法
#
# import_url 指向系统根目录（登录页），不是课表页：强智登录表单不支持跳转参数，
# 登录成功一律落在「学生个人中心」，而课表页在未登录时不给登录界面。登录后脚本会
# 检测到「已登录但不在课表页」并自动跳到课表页，用户只需再点一次运行。
adapters:
  - adapter_id: "CQCST_01"
    adapter_name: "重庆城市科技学院强智适配"
    category: "BACHELOR_AND_ASSOCIATE"
    asset_js_path: "cqcst_01.js"
    import_url: "http://jw.cqcst.edu.cn/cqdxcskjxy_jsxsd/"
    maintainer: "Mutx163"
    description: "登录后停留在「学期理论课表」页面再运行（若登录后停在个人中心，点一次运行会自动跳转过去，再点一次即可）。自动附带学校公布的作息时间表（两校区共四套，导入时选一套）。"
  - adapter_id: "CQCST_02"
    adapter_name: "重庆城市科技学院强智适配（按教学楼自动分流作息）"
    category: "BACHELOR_AND_ASSOCIATE"
    asset_js_path: "cqcst_02.js"
    import_url: "http://jw.cqcst.edu.cn/cqdxcskjxy_jsxsd/"
    maintainer: "Mutx163"
    description: "登录后停留在「学期理论课表」页面再运行（若登录后停在个人中心，点一次运行会自动跳转过去，再点一次即可）。同标准版，但导入时只需选校区，软件会按教室名把课程自动分到「主教学楼」与「其他教学楼」两套作息，导入后不用再手动调整上课时间。宿主不支持该功能时自动退回选一套作息。"
